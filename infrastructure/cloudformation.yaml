AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  IoT Face Recognition System - Complete Serverless Backend
  Includes: S3 Bucket, Rekognition Collection, IAM Roles, Lambda Functions with triggers and public URLs.
  
  Deploy with: sam deploy --guided
  Delete with: sam delete --stack-name <stack-name>

# ==============================================================================
# PARAMETERS
# ==============================================================================
Parameters:
  S3BucketName:
    Type: String
    Default: nghi-face-recognition-bucket
    Description: Name of the S3 bucket for storing captured images

  RekognitionCollectionId:
    Type: String
    Default: home-security-faces
    Description: Name of the Rekognition Face Collection

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

  TelegramBotToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Telegram bot token used to send security notifications

  TelegramChatId:
    Type: String
    Default: ""
    Description: Telegram chat ID or group chat ID that receives alerts

  DeviceOfflineThresholdSec:
    Type: Number
    Default: 90
    Description: Number of seconds without heartbeat before a device is considered offline

# ==============================================================================
# RESOURCES
# ==============================================================================
Resources:

  # ============================================================================
  # 1. S3 BUCKET - Stores captured images from edge devices
  # ============================================================================
  FaceDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Ref S3BucketName
      # Allow public access for image viewing on dashboard
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      # CORS for web uploads via presigned URLs
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: ["GET", "PUT", "POST", "DELETE", "HEAD"]
            AllowedOrigins: ["*"]
            ExposedHeaders: ["ETag"]
            MaxAge: 3000
      # Auto-delete old captures after 30 days (cost saving)
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldCaptures
            Status: Enabled
            Prefix: captures/
            ExpirationInDays: 30

  # S3 Bucket Policy - Public read for captured images
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FaceDataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${S3BucketName}/*"

  # ============================================================================
  # 2. DYNAMODB TABLES - Primary application storage
  # ============================================================================
  DetectionEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "home-security-detections-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  KnownPersonsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "home-security-known-persons-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: face_id
          AttributeType: S
      KeySchema:
        - AttributeName: face_id
          KeyType: HASH

  DeviceStatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "home-security-device-status-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH

  # ============================================================================
  # 3. IAM ROLE - Permissions for Lambda functions
  # ============================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "HomeSecurityLambdaRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IoTFaceRecognitionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
              # S3 Access
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/*"
              # Rekognition Access
              - Effect: Allow
                Action:
                  - rekognition:IndexFaces
                  - rekognition:SearchFacesByImage
                  - rekognition:DeleteFaces
                  - rekognition:ListFaces
                Resource: !Sub "arn:aws:rekognition:${AWS::Region}:${AWS::AccountId}:collection/${RekognitionCollectionId}"
              # DynamoDB Access
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt DetectionEventsTable.Arn
                  - !GetAtt KnownPersonsTable.Arn
                  - !GetAtt DeviceStatusTable.Arn

  # ============================================================================
  # 4. LAMBDA FUNCTION: ProcessImage
  #    Triggered by S3 when new image uploaded to captures/ folder
  #    Calls Rekognition to detect/match faces, saves results to DynamoDB
  # ============================================================================
  ProcessImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "HomeSecurity_ProcessImage_${Environment}"
      Description: Process uploaded images - detect faces and match against known identities
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: ../lambda/process_image/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Architectures:
        - arm64  # Graviton2 - cheaper and faster
      Environment:
        Variables:
          REKOGNITION_COLLECTION_ID: !Ref RekognitionCollectionId
          DYNAMODB_DETECTIONS_TABLE: !Ref DetectionEventsTable
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
          ENVIRONMENT: !Ref Environment
      # S3 Trigger - fires when .jpg uploaded to captures/ prefix
      Events:
        S3NewCapture:
          Type: S3
          Properties:
            Bucket: !Ref FaceDataBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: captures/
                  - Name: suffix
                    Value: .jpg

  # ============================================================================
  # 5. LAMBDA FUNCTION: ManageFaces
  #    API for managing known faces - index new faces, list, delete
  #    Exposed via Function URL (public HTTP endpoint)
  # ============================================================================
  ManageFacesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "HomeSecurity_ManageFaces_${Environment}"
      Description: API for managing known faces - CRUD operations
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: ../lambda/manage_faces/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Architectures:
        - arm64
      Environment:
        Variables:
          REKOGNITION_COLLECTION_ID: !Ref RekognitionCollectionId
          S3_BUCKET_NAME: !Ref S3BucketName
          DYNAMODB_DETECTIONS_TABLE: !Ref DetectionEventsTable
          DYNAMODB_KNOWN_PERSONS_TABLE: !Ref KnownPersonsTable
          DYNAMODB_DEVICE_STATUS_TABLE: !Ref DeviceStatusTable
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
          DEVICE_OFFLINE_THRESHOLD_SEC: !Ref DeviceOfflineThresholdSec
          ENVIRONMENT: !Ref Environment
      # Public HTTP endpoint (no API Gateway needed)
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - "*"
          AllowHeaders:
            - content-type
            - x-api-key
          MaxAge: 300

  # Permission for public Function URL access
  ManageFacesUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ManageFacesFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # ============================================================================
  # 6. LAMBDA FUNCTION: DeviceAlertMonitor
  #    Runs on a schedule to detect offline devices based on missed heartbeats
  # ============================================================================
  DeviceAlertMonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "HomeSecurity_DeviceAlertMonitor_${Environment}"
      Description: Scheduled monitor that sends offline device alerts to Telegram
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: ../lambda/device_alert_monitor/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Architectures:
        - arm64
      Environment:
        Variables:
          DYNAMODB_DEVICE_STATUS_TABLE: !Ref DeviceStatusTable
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
          DEVICE_OFFLINE_THRESHOLD_SEC: !Ref DeviceOfflineThresholdSec
          ENVIRONMENT: !Ref Environment
      Events:
        DeviceOfflineMonitor:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Name: !Sub "HomeSecurity-DeviceOfflineMonitor-${Environment}"
            Description: Check for devices that missed heartbeat updates
            Enabled: true

# ==============================================================================
# OUTPUTS - Important values for dashboard configuration
# ==============================================================================
Outputs:
  S3BucketName:
    Description: S3 Bucket for storing images
    Value: !Ref FaceDataBucket
    Export:
      Name: !Sub "${AWS::StackName}-S3Bucket"

  S3BucketUrl:
    Description: Public URL for S3 bucket
    Value: !Sub "https://${S3BucketName}.s3.${AWS::Region}.amazonaws.com"

  RekognitionCollectionId:
    Description: Rekognition Collection ID
    Value: !Ref RekognitionCollectionId

  DetectionsTableName:
    Description: DynamoDB table for detection events
    Value: !Ref DetectionEventsTable

  KnownPersonsTableName:
    Description: DynamoDB table for known persons
    Value: !Ref KnownPersonsTable

  DeviceStatusTableName:
    Description: DynamoDB table for device status
    Value: !Ref DeviceStatusTable

  ProcessImageFunctionArn:
    Description: ARN of ProcessImage Lambda
    Value: !GetAtt ProcessImageFunction.Arn

  ManageFacesFunctionUrl:
    Description: Public URL for ManageFaces API (use this in dashboard .env)
    Value: !GetAtt ManageFacesFunctionUrl.FunctionUrl
    Export:
      Name: !Sub "${AWS::StackName}-ManageFacesUrl"

  DashboardEnvConfig:
    Description: Copy these values to dashboard/.env.local
    Value: !Sub |
      APP_AWS_REGION=${AWS::Region}
      AWS_REGION=${AWS::Region}
      NEXT_PUBLIC_LAMBDA_MANAGE_FACES_URL=${ManageFacesFunctionUrl.FunctionUrl}
      NEXT_PUBLIC_S3_BUCKET_URL=https://${S3BucketName}.s3.${AWS::Region}.amazonaws.com
      S3_BUCKET_NAME=${S3BucketName}
      REKOGNITION_COLLECTION_ID=${RekognitionCollectionId}
      DYNAMODB_DETECTIONS_TABLE=${DetectionEventsTable}
      DYNAMODB_KNOWN_PERSONS_TABLE=${KnownPersonsTable}
      DYNAMODB_DEVICE_STATUS_TABLE=${DeviceStatusTable}
